name: foundry_stack_mobile
description: "Aplicativo Flutter do starter full-stack FoundryStack."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cupertino_ui: ^1.0.0
  dio: ^5.9.2
  auto_injector: ^2.2.0
  go_router: ^18.0.1
  flutter_secure_storage: ^10.3.1
  intl: ^0.20.3
  material_ui: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/google_sans/OFL.txt
    - assets/fonts/quicksand/OFL.txt

  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/google_sans/GoogleSans-Variable.ttf
    - family: Quicksand
      fonts:
        - asset: assets/fonts/quicksand/Quicksand-Variable.ttf
